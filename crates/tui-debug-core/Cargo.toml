[package]
name = "tui-debug-core"
description = "DAP debugger engine for tui-debug"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "tui_debug_core"
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
anyhow = "1"
crossbeam-channel = "0.5"
libc = "0.2"
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tree-sitter = "0.24"
tree-sitter-highlight = "0.24"
tree-sitter-python = "0.23"

[build-dependencies]
cbindgen = "0.28"
