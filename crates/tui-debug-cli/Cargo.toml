[package]
name = "tui-debug-cli"
description = "CLI entry for tui-debug (test subcommand + launcher)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tui-debug"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tui-debug-core = { path = "../tui-debug-core" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
