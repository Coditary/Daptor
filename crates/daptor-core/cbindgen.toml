language = "C"
cpp_compat = true
include_guard = "DAPTOR_H"
autogen_warning = "/* Warning, this file is autogenerated by cbindgen. Do not modify manually. */"
usize_is_size_t = true
documentation = true
documentation_style = "c99"

[parse]
parse_deps = false

[export]
include = [
    "tui_debug_set_tree_sitter_dir",
    "tui_debug_init",
    "tui_debug_language_from_path",
    "tui_debug_language_is_loaded",
    "tui_debug_try_load_language",
    "tui_debug_last_error",
    "tui_debug_resolve_launch",
    "tui_debug_session_launch",
    "tui_debug_session_launch_lldb",
    "tui_debug_session_launch_rr",
    "tui_debug_session_launch_resolved",
    "tui_debug_session_free",
    "tui_debug_poll",
    "tui_debug_command",
    "tui_debug_sync_snapshot",
    "tui_debug_drain_console",
    "tui_debug_drain_network",
    "tui_debug_send_network_compose",
    "tui_debug_network_proxy_address",
    "tui_debug_terminal_write",
    "tui_debug_evaluate",
    "tui_debug_completions",
    "tui_debug_set_breakpoints",
    "tui_debug_data_breakpoint_info",
    "tui_debug_set_data_breakpoints",
    "tui_debug_set_function_breakpoints",
    "tui_debug_set_exception_breakpoints",
    "tui_debug_fetch_variables",
    "tui_debug_set_variable",
    "tui_debug_fetch_source",
    "tui_debug_fetch_step_in_targets",
    "tui_debug_fetch_goto_targets",
    "tui_debug_read_memory",
    "tui_debug_write_memory",
    "tui_debug_disassemble",
    "tui_debug_highlight_viewport",
    "tui_debug_function_name_at_line",
    "tui_debug_function_definition_line",
    "tui_debug_identifier_at_position",
]

[fn]
must_use = "MUST_USE_FUNC"

[defines]
"target_os = windows" = "DAPTOR_WINDOWS"
