name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact: linux-x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install build dependencies
        run: bash scripts/ci/install-apt-build-deps.sh

      - name: Build Rust CLI
        run: cargo build --release -p daptor-cli

      - name: Build UI
        run: |
          cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build cpp/build -j"$(nproc)"

      - name: Package release archive
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STAGING="daptor-${VERSION}-${{ matrix.artifact }}"
          mkdir -p "${STAGING}/bin" "${STAGING}/config" "${STAGING}/schemas"
          cp cpp/build/daptor "${STAGING}/bin/daptor"
          cp target/release/daptor "${STAGING}/bin/daptor-cli"
          cp config/config.yaml config/definitions.yaml config/theme.json "${STAGING}/config/"
          cp schemas/config.schema.yaml schemas/theme.schema.json "${STAGING}/schemas/"
          cp README.md "${STAGING}/"
          tar -czf "${STAGING}.tar.gz" "${STAGING}"
          echo "ARCHIVE=${STAGING}.tar.gz" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: daptor-${{ matrix.artifact }}
          path: daptor-*-*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-linux]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: daptor-*
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: daptor-*-*.tar.gz
