# YAML schema for ~/.config/tui-debug/config.yaml

$schema: https://json-schema.org/draft/2020-12/schema
$id: https://tui-debug.dev/schemas/config.schema.yaml
title: tui-debug configuration
type: object
additionalProperties: false
properties:
  theme:
    type: object
    additionalProperties: false
    properties:
      file:
        type: string
        default: theme.json
  paths:
    type: object
    additionalProperties: false
    properties:
      tree_sitter_dir:
        type: string
        description: Directory containing per-language tree-sitter grammars and queries.
  layout:
    type: object
    additionalProperties: false
    properties:
      sidebar_pct:
        type: integer
        minimum: 1
        maximum: 99
      bottom_pct:
        type: integer
        minimum: 1
        maximum: 99
      docks:
        type: object
        additionalProperties: false
        properties:
          left:
            $ref: "#/$defs/panel_list"
          center:
            $ref: "#/$defs/panel_list"
          bottom:
            $ref: "#/$defs/panel_list"
  definitions:
    type: string
    description: Path to launch definitions YAML (default definitions.yaml in the config directory).
  default_profile:
    type: string
    description: Profile used when auto-selection does not match.
  adapters:
    type: object
    additionalProperties:
      $ref: "#/$defs/adapter"
  profiles:
    type: object
    additionalProperties:
      $ref: "#/$defs/profile"
  keybindings:
    type: object
    additionalProperties: false
    properties:
      continue: { type: string }
      step_over: { type: string }
      step_into: { type: string }
      step_out: { type: string }
      breakpoint: { type: string }
      focus_repl: { type: string }
      follow_execution: { type: string }
      file_picker: { type: string }
      panel_prev: { type: string }
      panel_next: { type: string }
      quit: { type: string }
      continue_fn: { type: string }
      step_over_fn: { type: string }
      step_into_fn: { type: string }
      step_out_fn: { type: string }
      breakpoint_fn: { type: string }
$defs:
  adapter:
    type: object
    required: [command]
    additionalProperties: false
    properties:
      command: { type: string }
      args:
        type: array
        items: { type: string }
      transport: { type: string, enum: [stdio] }
      ui_adapter: { type: string, enum: [debugpy, lldb, generic] }
      initialize: { type: object }
      launch: { type: object }
  profile:
    type: object
    additionalProperties: false
    properties:
      backend: { type: string, enum: [dap, rr] }
      adapter: { type: string }
      priority: { type: integer }
      match:
        type: object
        properties:
          extensions:
            type: array
            items: { type: string }
          files:
            type: array
            items: { type: string }
          executable: { type: boolean }
          go_binary: { type: boolean }
      resolve:
        type: object
        additionalProperties: { type: string }
      launch: { type: object }
      prelaunch:
        type: array
        items: { type: string }
      workspace: { type: string }
      path_map:
        type: array
        items:
          type: object
          required: [from, to]
          properties:
            from: { type: string }
            to: { type: string }
  panel_list:
    type: array
    items:
      oneOf:
        - type: string
        - type: object
          additionalProperties: false
          required: [panel]
          properties:
            panel:
              type: string
              enum:
                - variables
                - scopes
                - watches
                - threads
                - stacks
                - breakpoints
                - source
                - memory
                - disassembly
                - file_tree
                - resources
                - network
                - repl
                - console
            scope:
              type: string
              description: Filter a variables panel to a single DAP scope name.
            breakpoint:
              type: string
              enum: [source, function, data, exception]
            thread_filter:
              type: string
              enum: [stopped, running]
            thread_id:
              type: integer
            thread_name:
              type: string
            label:
              type: string
